<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Das Zusammenspiel von Erdsonde, Wärmepumpe und Gebäude</title>
  <desc id="desc">Drei klar getrennte Bereiche zeigen die Wärmequelle im Boden, die Wärmepumpe mit elektrischer Antriebsenergie sowie die Wärmeverteilung im Haus. Getrennte Leitungen stellen Quellen- und Heizkreislauf dar.</desc>
